<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#060b1a" />
    <title>Grand Theft Cosmos</title>
    <style>
      :root { --bg: #060b1a; --fg: #d8f3ff; --dim: #6c88a8; --cyan: #2ee6e6; --gold: #ffd23f; --red: #ff4d6d; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 18px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      button { font: inherit; color: var(--bg); background: var(--cyan); border: 0; border-radius: 10px; padding: 12px 20px; min-height: 64px; min-width: 64px; cursor: pointer; touch-action: manipulation; }
      button:disabled { opacity: 0.35; }
      button.alt { background: transparent; color: var(--cyan); border: 2px solid var(--cyan); }
      input, select { font: inherit; color: var(--fg); background: #0d1730; border: 2px solid #23406a; border-radius: 10px; padding: 12px; min-height: 56px; }
      .card { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
      .rules { border: 2px solid var(--cyan); border-radius: 14px; padding: 16px 20px; background: #0a1430; }
      .rules ol { margin: 0; padding-left: 1.4em; }
      .rules li { margin: 0.35em 0; }
      .rules b { color: var(--gold); }
      .ctlpic { color: var(--dim); margin-top: 10px; font-size: 0.85em; }
      .full { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 14px; text-align: center; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); z-index: 50; }
      .veil { background: rgba(6, 11, 26, 0.88); }
      .lobby, .endscr { background: var(--bg); }
      .rules { text-align: left; }
      .hidden { display: none !important; }
      h1 { color: var(--cyan); letter-spacing: 0.05em; margin: 0.2em 0; }
      .muted { color: var(--dim); }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
